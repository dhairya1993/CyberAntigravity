<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 56" fill="none" width="100%" height="100%">
  <title>CyberAntigravity Logo - Dark Monochrome</title>
  
  <!-- ================= SYMBOL MARK (0 - 52) ================= -->
  <g transform="translate(4, 4)">
    <!-- Subtle Shield Telemetry Outline -->
    <path d="M24 5 L39 10.5 L39 24.5 C39 33.5 24 42.5 24 42.5 C24 42.5 9 33.5 9 24.5 L9 10.5 Z" 
          stroke="#0F172A" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="2 1.5" fill="none"/>

    <!-- The "C" Element (Left Flank) -->
    <path d="M 22 8
             L 11 12
             L 11 25.5
             C 11 33.5, 17.5 38.5, 22.5 41
             L 22.5 35.5
             C 19 33.5, 15.5 29.5, 15.5 24
             L 15.5 15.5
             L 22 13
             Z" 
          fill="#0F172A"/>

    <!-- The "A" Element (Right Flank & Apex) -->
    <path d="M 25.5 7
             L 29.5 7
             L 37 25.5
             C 37 33.5, 30.5 38.5, 25.5 41
             L 25.5 35.5
             C 29 33.5, 32.5 29.5, 32.5 24
             L 28 13.5
             L 25.5 13.5
             Z" 
          fill="#0F172A" fill-opacity="0.85"/>

    <!-- Ascending Chevron Arrow (A Apex) -->
    <path d="M 24 7.5
             L 30 20
             L 26.5 20
             L 24 14.5
             L 21.5 20
             L 18 20
             Z" 
          fill="#0F172A"/>

    <!-- Horizontal Security Crossbar of A -->
    <path d="M 19.5 22.5
             L 28.5 22.5
             L 27.5 25.5
             L 20.5 25.5
             Z" 
          fill="#0F172A" fill-opacity="0.9"/>

    <!-- Central Verified Node -->
    <circle cx="24" cy="18" r="1.5" fill="#0F172A"/>
  </g>

  <!-- ================= WORDMARK & TAGLINE ================= -->
  <g transform="translate(64, 0)">
    <!-- Brand Wordmark -->
    <text x="0" y="30" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="800" letter-spacing="-0.5" fill="#0F172A">
      CyberAntigravity
    </text>

    <!-- Tagline -->
    <text x="0.5" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" letter-spacing="2.6" fill="#475569">
      RISE ABOVE CYBER THREATS.
    </text>
  </g>
</svg>
