<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="100%" height="100%">
  <title>CyberAntigravity Shield Mark</title>
  <defs>
    <!-- Primary Cyan to Deep Electric Blue Gradient -->
    <linearGradient id="caSymbol_cyan" x1="8" y1="6" x2="24" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="60%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Secondary Cyan/Blue Tech Gradient for A element -->
    <linearGradient id="caSymbol_blue" x1="24" y1="6" x2="40" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Subtle Ambient Cyan Glow Behind Shield -->
    <filter id="caSymbol_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Layer -->
  <path d="M24 4 L40 10 L40 25 C40 34.5 24 44 24 44 C24 44 8 34.5 8 25 L8 10 Z" 
        fill="#00F0FF" opacity="0.15" filter="url(#caSymbol_glow)"/>

  <!-- Subtle Shield Telemetry Outline -->
  <path d="M24 5 L39 10.5 L39 24.5 C39 33.5 24 42.5 24 42.5 C24 42.5 9 33.5 9 24.5 L9 10.5 Z" 
        stroke="#00F0FF" stroke-width="0.8" stroke-opacity="0.35" stroke-dasharray="2 1.5" fill="none"/>

  <!-- 
    ===================================================================
    THE "C" ELEMENT:
    Forms the left defensive shield perimeter, top sweep, and bottom return.
    ===================================================================
  -->
  <path d="M 22 8
           L 11 12
           L 11 25.5
           C 11 33.5, 17.5 38.5, 22.5 41
           L 22.5 35.5
           C 19 33.5, 15.5 29.5, 15.5 24
           L 15.5 15.5
           L 22 13
           Z" 
        fill="url(#caSymbol_cyan)"/>

  <!-- 
    ===================================================================
    THE "A" ELEMENT:
    Ascends dynamically into the top right, forms the A apex,
    right flank, and central crossbar with a sleek negative-space circuit separation.
    ===================================================================
  -->
  <!-- Right Flank & Outer Wing of A -->
  <path d="M 25.5 7
           L 29.5 7
           L 37 25.5
           C 37 33.5, 30.5 38.5, 25.5 41
           L 25.5 35.5
           C 29 33.5, 32.5 29.5, 32.5 24
           L 28 13.5
           L 25.5 13.5
           Z" 
        fill="url(#caSymbol_blue)"/>

  <!-- Ascending Chevron Arrow (A Apex - "Rise") -->
  <path d="M 24 7.5
           L 30 20
           L 26.5 20
           L 24 14.5
           L 21.5 20
           L 18 20
           Z" 
        fill="url(#caSymbol_cyan)"/>

  <!-- Horizontal Security Crossbar of A -->
  <path d="M 19.5 22.5
           L 28.5 22.5
           L 27.5 25.5
           L 20.5 25.5
           Z" 
        fill="#00F0FF"/>

  <!-- Central Emerald Verified Node (Zero-Trust Core) -->
  <circle cx="24" cy="18" r="1.5" fill="#10B981"/>
</svg>
